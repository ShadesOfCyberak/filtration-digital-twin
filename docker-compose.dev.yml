version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filtration-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - INFLUXDB_URL=http://influxdb:8086
      - MQTT_BROKER_HOST=mosquitto

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: filtration-frontend-dev
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
